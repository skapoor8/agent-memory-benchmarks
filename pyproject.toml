[project]
name = "agent-memory-benchmarks"
version = "0.1.0"
description = "Retrieval benchmark harness for code finding, doc search, episodic memory, and skill routing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "jupyterpress",
  "click>=8.1",
  "lancedb>=0.21",
  "chromadb>=0.6",
  "tantivy>=0.22",
  "qdrant-client>=1.14",
  "sentence-transformers>=3.4",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "python-frontmatter>=1.1",
  "gutenbergpy>=0.3",
  "beir>=2.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "matplotlib>=3.8",
  "requests>=2.32",
  "datasets>=2.21",
]

[project.scripts]
amb = "agent_memory_benchmarks.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8",
  "pytest-timeout>=2",
  "ghp-import>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.uv.sources]
jupyterpress = { path = "src/jupyterpress", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "pygments>=2.20.0",
]
