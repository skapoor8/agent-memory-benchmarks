[project]
name = "jupyterpress"
version = "0.1.0"
description = "Jupyter-notebook to static site generator with AI-inspired themes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
  "markdown>=3.10",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pygments>=2.20",
  "pyyaml>=6.0",
]

[project.scripts]
jupyterpress = "jupyterpress.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jupyterpress*"]
